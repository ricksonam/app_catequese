<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="google" content="notranslate" />
    <title>iCatequese</title>
    <meta name="description" content="iCatequese – Gestão inteligente para catequistas. Sistema completo para gestão de turmas, encontros e catequizandos.">
    <meta name="author" content="iCatequese" />

    <!-- Preload apenas ícones PWA essenciais (imagens do dashboard carregam sob demanda) -->
    <link rel="preload" as="image" href="/icon-192.png" fetchpriority="high">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="iCatequese">
    <meta property="og:description" content="Gestão eficiente para catequistas e turmas de IVC.">
    <meta property="og:image" content="/icon-512.png">
    
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="iCatequese">
    <meta name="twitter:description" content="Gestão inteligente para catequistas e turmas de IVC.">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="iCatequese">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#2a4bd1">
    <style>
      #initial-loader {
        position: fixed; inset: 0; background: #ffffff;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; z-index: 9999; gap: 16px;
      }
      #initial-loader img { width: 72px; height: 72px; border-radius: 18px; object-fit: contain; }
      #initial-loader .bar-wrap { width: 160px; height: 4px; background: #e8eeff; border-radius: 99px; overflow: hidden; }
      #initial-loader .bar {
        height: 100%; width: 40%; background: #2a4bd1; border-radius: 99px;
        animation: bar-slide 1.2s ease-in-out infinite;
      }
      @keyframes bar-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(400%); }
      }
    </style>
  </head>

  <body>
    <div id="initial-loader">
      <img src="/icon-192.png" alt="iCatequese" />
      <div class="bar-wrap"><div class="bar"></div></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove o loader assim que o React montar
      document.addEventListener('DOMContentLoaded', function() {
        var observer = new MutationObserver(function() {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            var loader = document.getElementById('initial-loader');
            if (loader) { loader.style.opacity = '0'; loader.style.transition = 'opacity 0.3s'; setTimeout(function(){ loader.remove(); }, 300); }
            observer.disconnect();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true });
      });

      // Bloquear zoom por pinça (iOS Safari ignora user-scalable=no)
      document.addEventListener('touchmove', function(e) {
        if (e.touches && e.touches.length > 1) { e.preventDefault(); }
      }, { passive: false });
      document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
      document.addEventListener('gesturechange', function(e) { e.preventDefault(); });
      document.addEventListener('gestureend', function(e) { e.preventDefault(); });
    </script>
  </body>
</html>
